<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>历史上的今天</title>
<meta name="description" content="按日期浏览历史上发生过的有影响力的事件，面向 10–18 岁的中文读者。">
<!-- 站点图标：「史」字（assets/icon.svg，字形已转为 path，不依赖访问者字体）。
     SVG 优先 —— 任意尺寸都清晰；PNG 是 iOS 主屏的回落，它不认 SVG favicon。 -->
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">

<!-- 分享预览（Open Graph / Twitter Card）。
     粘到微信、Slack、iMessage 时决定对方看到什么 —— 没有这些就只有
     一条光秃秃的网址。
     ⚠ og:image **必须**是绝对 URL：抓取方不在本站上下文里，相对路径
       解析不了。其余相对路径（icon/css）不受影响。
     ⚠ 用 PNG 不用 SVG：多数平台的抓取器不渲染 SVG。
     theme-color 影响 Android Chrome 的地址栏配色，取站点主色。 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="历史上的今天">
<meta property="og:title" content="历史上的今天">
<meta property="og:description" content="按日期读历史上的大事。15,317 条、366 天，面向 10–18 岁的中文读者。">
<meta property="og:url" content="https://learning-hub-ai.github.io/on-this-day/">
<meta property="og:image" content="https://learning-hub-ai.github.io/on-this-day/assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="历史上的今天 —— 按日期读历史上的大事">
<meta property="og:locale" content="zh_CN">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="历史上的今天">
<meta name="twitter:description" content="按日期读历史上的大事。15,317 条、366 天，面向 10–18 岁的中文读者。">
<meta name="twitter:image" content="https://learning-hub-ai.github.io/on-this-day/assets/og-card.png">
<meta name="theme-color" content="#9c4a2f">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="site-title">
    <span class="site-mark" aria-hidden="true">◷</span> <span>历史上的今天</span>
  </div>

  <!-- 第二行：日期选择 ＋「今天」，整组居中 -->
  <div class="date-picker">
    <select id="selMonth" aria-label="选择月份"></select>
    <select id="selDay" aria-label="选择日期"></select>
    <button id="btnTodayInline" class="btn-today-inline" type="button"
            title="回到今天">回到今天</button>
  </div>
</header>

<main class="content">

  <section class="date-hero">
    <h1 id="heroDate">10 月 9 日</h1>
    <p id="heroMeta" class="hero-meta">共 39 条 · 维基精选 5 条 · 更多 34 条</p>
    <!-- 日期出处：本页全部事件都来自维基百科该日期条目，这是日期声明的依据 -->
    <p class="hero-source">
      事件与日期取自<a id="sourceLink" href="https://zh.wikipedia.org/zh-cn/10月9日"
        target="_blank" rel="noopener noreferrer" hreflang="zh">维基百科「10月9日」原始条目</a>
    </p>
  </section>

  <!-- 精选：维基编者挑选的当日最值得一提的 5 条（spec.md §3.2）-->
  <!-- 领域筛选。标签由 render.js 按当天实有分类生成 ——
       空分类直接不显示，避免点进去空页（spec.md §5.6 的教训）-->
  <nav class="filter-bar" id="filterBar" role="group" aria-label="按领域筛选"></nav>

  <section class="selected-section" aria-labelledby="selTitle">
    <h2 id="selTitle" class="section-title">精选</h2>
    <ol class="timeline" id="selectedList"></ol>
  </section>

  <!-- 更多事件：默认折叠（layout.md §5.8）。
       ⚠ 标题用「更多事件」：
         - 不能叫「全部事件」—— 这一节**不含**上面的精选，叫「全部」
           会和精选区的条数对不上，用户会以为数字错了（§6.5）。
         - 不能叫「其他事件」—— 「其他」是八个分类之一（占 45%），
           同屏出现会和分类筛选栏的「其他」撞义。
         - 不用「其余事件」—— 要先知道上面挑走了一部分才讲得通，且偏书面。
           「更多」不预设前提，也更口语，适合 10 岁基准读者。 -->
  <section class="events-section" aria-labelledby="evtTitle">
    <button class="section-toggle" id="evtToggle" type="button"
            aria-expanded="false" aria-controls="eventsList">
      <span class="toggle-arrow" aria-hidden="true">▸</span>
      <span id="evtTitle">更多事件（<span id="evtCount">34</span>）</span>
    </button>
    <ol class="timeline" id="eventsList" hidden></ol>
  </section>

  <div class="empty-state" id="emptyState" hidden>
    <span class="empty-icon" aria-hidden="true">◌</span>
    <p>这一天还没有整理好的事件</p>
    <p class="empty-hint">换一天看看，或者</p>
    <button class="btn-secondary" type="button" data-action="today">回到今天</button>
  </div>

</main>

<footer>
  数据取自<a href="https://zh.wikipedia.org" target="_blank"
     rel="noopener noreferrer" hreflang="zh">中文维基百科</a>
  · 授权 <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.zh"
            target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>
  · 抓取于 <span id="fetchDate">2026-10</span>
</footer>

<script type="module" src="js/app.js"></script>

</body>
</html>
