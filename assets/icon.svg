<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="历史上的今天">
  <!-- 「史」的字形轮廓，自 Noto Sans CJK SC Black 提取后转为 path。
       为什么不用 text 元素 —— favicon 由访问者的字体渲染，没装 CJK 字体
       就是豆腐块；转成路径后处处一致。
       为什么用黑体不用宋体 —— 实测 16px 栅格化：宋体的细横笔画会糊成一团，
       黑体等线笔画撑得住，而 16px 是这个图标唯一真正要紧的尺寸。
       配色取自 css/style.css 的 accent 与 bg 两个令牌。 -->
  <rect width="64" height="64" rx="12" fill="#9c4a2f"/>
  <path transform="translate(10.00 51.36) scale(0.04400 -0.04400)"
